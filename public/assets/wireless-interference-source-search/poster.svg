<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Radio interference source autonomous search</title>
  <desc id="desc">A vector field map showing bearing uncertainty, coverage stations, candidate geometry, and a route through the search arena.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#294047" stroke-width="1"/></pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="#102027"/><rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <path d="M0 728H1600" stroke="#294047" stroke-width="2"/><path d="M84 104H652" stroke="#f18b70" stroke-width="5"/>
  <text x="86" y="154" fill="#9bbab2" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="5">CUMCM 2026 / PROBLEM B</text>
  <text x="86" y="270" fill="#f4f6f3" font-family="Arial, 'PingFang SC', sans-serif" font-size="76" font-weight="700" letter-spacing="-2">无线电干扰源</text>
  <text x="86" y="352" fill="#f18b70" font-family="Arial, 'PingFang SC', sans-serif" font-size="66" font-weight="700" letter-spacing="-2">自主搜索与清除</text>
  <text x="88" y="430" fill="#b7cac5" font-family="Arial, 'PingFang SC', sans-serif" font-size="25">从几何定位，到覆盖巡航，再到在线决策</text>
  <g transform="translate(120 584)">
    <text x="0" y="0" fill="#f4f6f3" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">GEOMETRY</text><text x="0" y="34" fill="#8ec5b5" font-family="Arial, Helvetica, sans-serif" font-size="18">HALF-PLANE INTERSECTION</text>
    <text x="310" y="0" fill="#f4f6f3" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">COVERAGE</text><text x="310" y="34" fill="#8ec5b5" font-family="Arial, Helvetica, sans-serif" font-size="18">7 / 25 STATIONS</text>
    <text x="570" y="0" fill="#f4f6f3" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">CERTIFICATION</text><text x="570" y="34" fill="#8ec5b5" font-family="Arial, Helvetica, sans-serif" font-size="18">MEC ≤ 20 M</text>
  </g>
