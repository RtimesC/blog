    <circle r="10" fill="#f18b70" filter="url(#softGlow)"/><path d="M-24 0H24M0 -24V24" stroke="#f4f6f3" stroke-width="2" opacity=".9"/>
    <text x="-54" y="-326" fill="#b7cac5" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">1800 M ARENA</text><text x="198" y="329" fill="#b7cac5" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">±1° BEARING</text>
  </g>
  <g transform="translate(1090 780)"><circle cx="0" cy="0" r="6" fill="#f18b70"/><text x="18" y="6" fill="#f4f6f3" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">MEC</text><circle cx="120" cy="0" r="6" fill="#8ec5b5"/><text x="138" y="6" fill="#f4f6f3" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">TSP ROUTE</text></g>
</svg>
