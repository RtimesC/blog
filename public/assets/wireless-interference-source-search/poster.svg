    <path d="M0 0L-244 -78L-138 -218L0 -300L182 -238L278 -80L268 104L142 246L-41 294L-215 210L-300 28L-250 -144L-90 -274L98 -283L250 -166L294 15L230 190L66 282L-122 250L-263 126L-282 -61L-182 -233L-4 -299L175 -243L280 -96L275 91L158 235L-28 297" fill="none" stroke="#8ec5b5" stroke-width="2.4" stroke-dasharray="1 12" stroke-linecap="round"/>
    <g fill="#f4f6f3" stroke="#f18b70" stroke-width="3"><circle cx="0" cy="-300" r="7"/><circle cx="234" cy="-188" r="7"/><circle cx="292" cy="67" r="7"/><circle cx="130" cy="270" r="7"/><circle cx="-130" cy="270" r="7"/><circle cx="-292" cy="67" r="7"/><circle cx="-234" cy="-188" r="7"/></g>
