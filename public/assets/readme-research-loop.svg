<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">taotao writing loop</title>
  <desc id="desc">A gentle animated loop from observe to write, test, publish and return.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#27404a" stroke-width="1"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="460" rx="28" fill="#102027"/>
  <rect width="1600" height="460" rx="28" fill="url(#grid)" opacity=".35"/>
  <text x="70" y="82" fill="#9eb9b5" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4">A SMALL PUBLIC LEARNING LOOP</text>
  <path d="M185 245H1415" fill="none" stroke="#40636d" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3s" repeatCount="indefinite"/>
  </path>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <g transform="translate(130 170)">
      <circle cx="55" cy="75" r="55" fill="#18313b" stroke="#ee9179" stroke-width="3"/>
      <circle cx="55" cy="75" r="10" fill="#ee9179" filter="url(#glow)"><animate attributeName="r" values="8;13;8" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="55" y="-10" text-anchor="middle" fill="#f5f2eb" font-size="25" font-weight="700">Observe</text>
      <text x="55" y="155" text-anchor="middle" fill="#9eb9b5" font-size="16">看见问题</text>
    </g>
    <g transform="translate(440 170)">
      <circle cx="55" cy="75" r="55" fill="#18313b" stroke="#8fc2b4" stroke-width="3"/>
      <path d="M32 75h46M55 52v46" stroke="#8fc2b4" stroke-width="5" stroke-linecap="round"/>
      <text x="55" y="-10" text-anchor="middle" fill="#f5f2eb" font-size="25" font-weight="700">Write</text>
      <text x="55" y="155" text-anchor="middle" fill="#9eb9b5" font-size="16">把想法留下</text>
    </g>
    <g transform="translate(750 170)">
      <circle cx="55" cy="75" r="55" fill="#18313b" stroke="#ee9179" stroke-width="3"/>
      <path d="M28 78l18 18 37-43" fill="none" stroke="#ee9179" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="-10" text-anchor="middle" fill="#f5f2eb" font-size="25" font-weight="700">Test</text>
      <text x="55" y="155" text-anchor="middle" fill="#9eb9b5" font-size="16">验证与修订</text>
    </g>
    <g transform="translate(1060 170)">
      <circle cx="55" cy="75" r="55" fill="#18313b" stroke="#8fc2b4" stroke-width="3"/>
      <path d="M32 76h46M55 53v46" stroke="#8fc2b4" stroke-width="5" stroke-linecap="round"/>
      <text x="55" y="-10" text-anchor="middle" fill="#f5f2eb" font-size="25" font-weight="700">Share</text>
      <text x="55" y="155" text-anchor="middle" fill="#9eb9b5" font-size="16">向外开放</text>
    </g>
    <g transform="translate(1370 170)">
      <circle cx="55" cy="75" r="55" fill="#18313b" stroke="#ee9179" stroke-width="3"/>
      <path d="M75 55a28 28 0 1 0 4 32" fill="none" stroke="#ee9179" stroke-width="5" stroke-linecap="round"/><path d="M80 50v20H60" fill="none" stroke="#ee9179" stroke-width="5" stroke-linecap="round"/>
      <text x="55" y="-10" text-anchor="middle" fill="#f5f2eb" font-size="25" font-weight="700">Return</text>
      <text x="55" y="155" text-anchor="middle" fill="#9eb9b5" font-size="16">回到问题</text>
    </g>
  </g>
  <text x="70" y="420" fill="#ee9179" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3">TAOTAO / ROBOTICS / AI / WRITING</text>
</svg>
