<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taotao · 字体试样</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=DM+Serif+Display:ital@0;1&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Fraunces:opsz,SOFT,WONK@9..144,0..100,0..1&family=Instrument+Serif:ital@0;1&family=Modak&family=Rubik+Mono+One&family=Silkscreen:wght@400;700&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color: #151515; background: #f6f4ef; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 42px; }
      h1 { margin: 0; font: italic 400 clamp(2.6rem, 7vw, 5.6rem)/.9 "Instrument Serif", Georgia, serif; letter-spacing: -.045em; }
      header p { max-width: 29rem; margin: 0; color: #69645c; font-size: .9rem; line-height: 1.55; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      button { min-height: 292px; padding: 28px; cursor: pointer; border: 1px solid #202020; border-radius: 16px; color: inherit; background: #fffdfa; text-align: left; transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease; }
      button:hover, button[aria-pressed="true"] { background: #fff; box-shadow: 7px 7px 0 #202020; transform: translate(-3px, -3px); }
      .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #6a665f; font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .sample { display: block; margin: 38px 0 16px; font-size: clamp(2.25rem, 5vw, 4.9rem); line-height: .95; }
      .note { margin: 0; color: #6a665f; font-size: .78rem; line-height: 1.4; }
      #choice { position: sticky; bottom: 18px; width: fit-content; max-width: calc(100vw - 32px); margin: 30px auto 0; padding: 12px 18px; border: 1px solid #202020; border-radius: 999px; background: #202020; color: #fff; font-size: .85rem; box-shadow: 4px 4px 0 #c9c3b8; }
      .eb { font-family: "EB Garamond", Georgia, serif; font-style: italic; }
      .instrument { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
      .fraunces { font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 60, "WONK" 1; }
      .dm { font-family: "DM Serif Display", Georgia, serif; font-style: italic; }
      .bungee { font-family: Bungee, Impact, sans-serif; }
      .anton { font-family: Anton, Impact, sans-serif; letter-spacing: .02em; }
      .rubik { font-family: "Rubik Mono One", monospace; font-size: clamp(1.65rem, 3.7vw, 3.35rem); }
      .silkscreen { font-family: Silkscreen, monospace; font-size: clamp(1.65rem, 3.7vw, 3.35rem); }
      .modak { font-family: Modak, cursive; }
      .zcool { font-family: "ZCOOL KuaiLe", cursive; }
      @media (max-width: 690px) { header { display: block; } header p { margin-top: 18px; } .grid { grid-template-columns: 1fr; } button { min-height: 230px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Pick a little<br />personality.</h1>
        <p>点击任意卡片，它会在下面记住你的选择。前四种是“有趣但仍能当博客标题”，后六种个性更强，适合栏目名、标签或海报式封面。</p>
      </header>

      <section class="grid" aria-label="字体试样">
        <button type="button" data-font="EB Garamond" aria-pressed="false"><span class="meta"><span>01 · 温柔书卷</span><span>推荐</span></span><span class="sample eb">Small ideas<br />grow slowly.</span><p class="note">EB Garamond Italic · 温润、有一点学者气，最容易融入现有页面。</p></button>
        <button type="button" data-font="Instrument Serif" aria-pressed="false"><span class="meta"><span>02 · 古怪优雅</span><span>推荐</span></span><span class="sample instrument">A curious<br />margin note.</span><p class="note">Instrument Serif Italic · 现代艺术刊物感，我最推荐它做「taotao」主标题。</p></button>
        <button type="button" data-font="Fraunces" aria-pressed="false"><span class="meta"><span>03 · 有机实验</span><span>推荐</span></span><span class="sample fraunces">Thinking,<br />with texture.</span><p class="note">Fraunces · 字形有弹性和小惊喜；有趣，但不会像卡通字体。</p></button>
        <button type="button" data-font="DM Serif Display" aria-pressed="false"><span class="meta"><span>04 · 复古戏剧</span><span>推荐</span></span><span class="sample dm">A very small<br />theatre.</span><p class="note">DM Serif Display Italic · 对比强、戏剧性高，适合文章标题。</p></button>
        <button type="button" data-font="Bungee" aria-pressed="false"><span class="meta"><span>05 · 彩色招牌</span><span>栏目用</span></span><span class="sample bungee">MAKE<br />A MARK</span><p class="note">Bungee · 像旧招牌与街头海报；适合标签或一期专题，别整站使用。</p></button>
        <button type="button" data-font="Anton" aria-pressed="false"><span class="meta"><span>06 · 海报压迫感</span><span>栏目用</span></span><span class="sample anton">LOUD<br />THOUGHTS</span><p class="note">Anton · 又高又窄，像杂志封面的声音；适合短而有力的标题。</p></button>
        <button type="button" data-font="Rubik Mono One" aria-pressed="false"><span class="meta"><span>07 · 数字玩具</span><span>点缀用</span></span><span class="sample rubik">tiny<br />signal</span><p class="note">Rubik Mono One · 块状、轻微像素感；适合项目编号或分类标签。</p></button>
        <button type="button" data-font="Silkscreen" aria-pressed="false"><span class="meta"><span>08 · 像素日记</span><span>点缀用</span></span><span class="sample silkscreen">hello,<br />archive</span><p class="note">Silkscreen · 老电脑与游戏界面气质；最适合日期、元信息。</p></button>
        <button type="button" data-font="Modak" aria-pressed="false"><span class="meta"><span>09 · 蓬松泡泡</span><span>封面用</span></span><span class="sample modak">BLOOM!</span><p class="note">Modak · 非常 playful；用于一张卡片封面会可爱，全站用会太满。</p></button>
        <button type="button" data-font="ZCOOL KuaiLe" aria-pressed="false"><span class="meta"><span>10 · 中文手写</span><span>封面用</span></span><span class="sample zcool">今天也要<br />乱想一下</span><p class="note">ZCOOL KuaiLe · 有手写温度的中文趣味字体；适合中文系列名。</p></button>
      </section>
      <output id="choice">尚未选择 · 点击一张卡片试试</output>
    </main>
    <script>
      const cards = document.querySelectorAll('[data-font]');
      const choice = document.querySelector('#choice');
      cards.forEach((card) => card.addEventListener('click', () => {
        cards.forEach((item) => item.setAttribute('aria-pressed', String(item === card)));
        choice.textContent = `已选：${card.dataset.font} · 告诉我编号，我就替换到首页标题`;
      }));
    </script>
  </body>
</html>
